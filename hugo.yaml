baseURL: https://linzeyan.github.io/

locale: en-us
title: "Ricky"

# Use Hugo modules to add theme
module:
  imports:
    # go.mod pins this to a commit on toha's main (bf0d55056672, 2026-11-22),
    # not a release: the Tailwind home page and posts (portfolio.modern below)
    # are newer than v4.17.0. Move to the first tag that has them. Four files
    # here are edited copies of the theme's, each says so in its first lines;
    # compare them with upstream after any upgrade.
    - path: github.com/hugo-toha/toha/v4
  mounts:
    # Declaring any assets mount drops Hugo's default one, so it is restated.
    - source: assets
      target: assets
    # One first-paint theme script for both of toha's page families (the file
    # says why); this is the name its Tailwind pages load it under.
    - source: assets/scripts/core/theme-scheme.js
      target: assets/scripts/modern/theme-init.js
    # Tailwind (toha's home page and posts) reads the class names Hugo saw
    # while rendering; see build.buildStats below.
    - source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
      disableWatch: true
    - source: static/files
      target: static/files
    - source: ./node_modules/flag-icon-css/flags
      target: static/flags
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts

# toha's home page and post layouts are styled with Tailwind, which only emits
# the classes listed in hugo_stats.json; the stylesheet is rebuilt when that
# list changes.
build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css

# Hugo's default allowlist plus tailwindcss, which toha runs from node_modules.
security:
  exec:
    allow: ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
  # Hugo runs Tailwind under Node's permission model and refuses to start when
  # a symlink in the project root points outside the readable paths. docs/ is
  # one (untracked, into a private notes repo); checkouts without it ignore this.
  node:
    permissions:
      allowRead: ['.', '../dev_docs/linzeyan.github.io']

# Manage languages
# For any more details, you can check the official documentation: https://gohugo.io/content-management/multilingual/
languages:
  en:
    label: English
    weight: 1
  zh-tw:
    label: Chinese
    weight: 2

# Force a locale to be use, really useful to develop the application ! Should be commented in production, the "weight" should rocks.
# DefaultContentLanguage: bn

# Allow raw html in markdown file
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false
  # Code is coloured once, at build time, in the One Dark palette the site
  # used to get from highlight.js. Colouring it again in the browser repainted
  # every block after load (seconds later on /notes/, whose gist embeds hold
  # back deferred JS). guessSyntax keeps unlabeled fences inside the same dark
  # block that highlight.js auto-detection used to give them.
  highlight:
    style: onedark
    guessSyntax: true

# At least HTML and JSON are required for the main HTML content and
# client-side JavaScript search
outputs:
  home:
    - HTML
    - RSS
    - JSON
    - HEADERS

mediaTypes:
  "text/plain":
    suffixes: [] # 讓副檔名變成空字串，產出的檔名就會剛好是 _headers

outputFormats:
  HEADERS:
    mediaType: "text/plain"
    baseName: "_headers"
    isPlainText: true

# Enable global emoji support
enableEmoji: true

# Site parameters
params:
  # Background image of the landing page
  background: /images/site/luis-quintero-4S_ClvzmN9w-unsplash.jpg

  # Provide logos for your site. The inverted logo will be used in the initial
  # transparent navbar and the main logo will be used in the non-transparent navbar.
  logo:
    main: /images/site/highlight.svg
    inverted: /images/site/highlight.svg
    favicon: /images/site/highlight.svg

  # GitHub repo of your site
  gitRepo: https://github.com/linzeyan.github.io
  # Default branch of your Git repo
  gitBranch: main

  # Configure the number of section title visible in the top navbar
  topNavbar:
    maxVisibleSections: 2

  # Configure various features of this theme
  features:
    # Neutral palette for the Tailwind pages; its dark scheme is pure black.
    componentsDesign:
      enable: true

    # Enable dark theme
    darkMode:
      enable: true

    # Enable and configure portfolio
    portfolio:
      enable: true
      # toha's Tailwind home page. It also switches the post archive and the
      # post reading page to their Tailwind layouts; notes, search and 404
      # stay on Bootstrap.
      modern:
        enable: true
        navigation: bar # bar | rail
        hero:
          style: photo # photo | surface
        # Posts lose their sidebar search box in the new archive; this dialog replaces it.
        search:
          enable: true

    # Enable and configure blog posts
    blog:
      enable: true
      # Share post on different social media
      shareButtons:
        facebook: true
        twitter: true
        linkedin: true
        reddit: true
        whatsapp: true
        email: true
        # tumblr: true
        pocket: true
        # diaspora: true
        mastodon: true

    # Enable & configure "Notes" features
    notes:
      enable: true

    # Enable comment feature. There, should be only one of them.
    comment:
      enable: false
      services:
        disqus:
          shortName: ricky-example-site
        # valine:
        #   appId: HTV6askWxVo3vOxlqjjaq2hd-MsYXbMMI
        #   appKey: pVrT3C85KGIuk27t07eh6bUC
        #   avatar: retro
        #   placeholder: Share your thought.
        #   lang: en
        #   recordIP: true
        #   enableQQ: true
        # utteranc:
        #   repo: github.com/hugo-toha/hugo-toha.github.io
        #   issueTerm: title
        #   theme: github-light
        # giscus:
        #   repo: your-repo/name
        #   repoID: your-repo-id
        #   category: your-category
        #   categoryID: your-category-id
        # theme: light
        # map: url
        # reaction: 1
        # metadata: 0
        # inputPosition: bottom
        # crossOrigin: anonymous
        # commento:
        #   serverURL: cdn.commento.io
        #   autoInit: true
        #   hideDeleted: false

    # Enable Analytics
    analytics:
      enabled: true
      services:
        # cloudflare web analytics
        cloudflare:
          token: "27a0cd9f0e3b46909879cf99f7cc6878"
        # Google Analytics
        # google:
        #   id: G-H4LBG7NDFZ
        # # CounterDev
        # counterDev:
        #   id: <your counterdev id>
        # # GoatCounter
        # goatCounter:
        #   code: <your goat counter code>
        # # Matomo / Piwik
        # matomo:
        #   instance: matomo.example.com
        #   siteId: 1 # Or any other number

    # Enable Support
    support:
      enable: false
      services:
        kofi:
          user: hossainemruz
          text: Tip Me
          textColor: "#f9fafc"
          backgroundColor: "#248aaa"
        # buymeacoffee:
        #   user: <your buymeacoffee.com user>
        #   text: Support me on Buy me a coffee!
        #   info: Buy me a coffee!
        #   color: '#FFDD00'

    # specify whether you want to show Table of Contents in reading page
    toc:
      enable: true

    # Show tags under the post title
    tags:
      enable: true

    # Specify whether to show flag in the language selector. Default is true.
    flags:
      enable: true
      # # If you want to use different country flag for a language, specify them here.
      flagOverwrites:
        - languageCode: en
          countryCode: us
        - languageCode: zh-tw
          countryCode: tw

    # Enable this to use `embed-pdf` shortcode.
    embedpdf:
      enable: true

    # Enable this to create flowcharts using shortcodes.
    flowchart:
      enable: true
      services:
        # Uncomment for `mermaid` shortcode.
        mermaid:
          # For config options, see: https://mermaid-js.github.io/mermaid/#/Setup?id=configuration
          # theme: dark

    # Enable this to create mathematic expressions using `$$` blocks
    math:
      enable: true
      services:
        # https://katex.org/docs/autorender.html#api for more configurations
        katex:
          delimiters:
            - left: $$
              right: $$
              display: true
            - left: \\[
              right: \\]
              display: true
            - left: $
              right: $
              display: false
            - left: \\(
              right: \\)
              display: false

    # Enable to use custom syntax highlight
    # Please note, Hugo comes with it's own html based syntax highlighter.
    # Your code block will still be syntax highlighted by hugo.
    # For more details: https://gohugo.io/content-management/syntax-highlighting/
    # To disable Hugo's builtin syntax highlight,
    # see: https://gohugo.io/getting-started/configuration-markup#highlight
    # ```
    # # config.yaml
    # markup:
    #   # this disables hugo's syntax highlighting.
    #   codeFences: false
    # ```
    # Off: Hugo already colours code at build time (markup.highlight above).
    syntaxHighlight:
      enable: false
      services:
        hljs:
          # see: https://highlightjs.readthedocs.io/en/latest/api.html#configure
          noHighlightRe: /^no-highlight$/i

    # Language header with a Copy button on every code block.
    codeBlock:
      copyButton:
        enable: true

    # Enable to use `video-player` shortcode
    videoPlayer:
      enable: true
      services:
        # convert .js-player class into video player via https://plyr.io/
        # Can play HTML5 Video, Audio, Youtube, Vimeo.
        # For more info on setup: https://github.com/sampotts/plyr#quick-setup
        plyr:
          # options doc: https://github.com/sampotts/plyr#options
          # fullscreen: true

  # Provide footer configuration.
  footer:
    enable: true
    # You can provide your custom footer template using this option.
    # Put your template in "layouts/partials" folder of your repo.
    template: footer.html
    # Show/hide navigation in the footer. Default is "true".
    navigation:
      enable: true
      # show custom menus in the footer
      customMenus: true
    # Show/hide "Contact Me" section in the footer. Default is "true".
    contactMe:
      enable: true
    # Show/hide credentials section in the footer. Default is "true".
    credentials:
      enable: false

    # Show/hide newsletter section in the footer. Default is "true".
    # Currently, it supports "mailchimp".
    newsletter:
      enable: false
      provider: mailchimp
      mailchimpURL: https://github.us1.list-manage.com/subscribe/post?u=19de52a4603135aae97163fd8&amp;id=094a24c76e

    # Show/hide disclaimer notice in the footer. Default is "false".
    disclaimer:
      enable: false
