# section information
section:
  name: Projects
  id: projects
  enable: true
  weight: 5
  showOnNavbar: true
  # Can optionally hide the title in sections
  # hideTitle: true

# filter buttons
# A button shows the projects that carry its filter as a tag (compared in lower
# case), so each project's first tag is its category. The categories are the
# groups of the profile README (linzeyan/linzeyan); a project without one only
# shows under All.
buttons:
  - name: All
    filter: "all"
  - name: App Store
    filter: "App Store"
  - name: Desktop Apps
    filter: "Desktop Apps"
  - name: Developer Tools
    filter: "Developer Tools"
  - name: Web
    filter: "Web"
  - name: Libraries
    filter: "Libraries"
  - name: Earlier Work
    filter: "Earlier Work"

# your projects
projects:
  - name: charta
    logo: /images/sections/projects/charta.svg
    role: Owner
    timeline: "October 2026 - Present"
    repo: https://github.com/linzeyan/charta
    summary: Interactive charts for all 59 data-driven methods in the Data Viz Catalogue, from bar charts to Sankey diagrams and choropleth maps. A Rust crate and a Go module render the same chart bit for bit, to HTML/SVG/PNG or into egui, Slint, Gio and Fyne; axes zoom by wheel, drag and brush, in the browser through WebAssembly.
    tags: ["Libraries", "Rust", "Go", "Charts"]
