# section information
section:
  name: 專案
  id: projects
  enable: true
  weight: 5
  showOnNavbar: true
  # Can optionally hide the title in sections
  # hideTitle: true

# filter buttons
# A button shows the projects that carry its filter as a tag (compared in lower
# case), so each project's first tag is its category. The categories are the
# groups of the profile README (linzeyan/linzeyan); a project without one only
# shows under All.
buttons:
  - name: 全部
    filter: "all"
  - name: App Store
    filter: "App Store"
  - name: 桌面應用
    filter: "桌面應用"
  - name: 開發工具
    filter: "開發工具"
  - name: 網頁
    filter: "網頁"
  - name: 函式庫
    filter: "函式庫"
  - name: 早期作品
    filter: "早期作品"

