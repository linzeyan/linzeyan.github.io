  - name: charta
    logo: /images/sections/projects/charta.svg
    role: 擁有者
    timeline: "2026 十月 - 現在"
    repo: https://github.com/linzeyan/charta
    summary: 涵蓋 Data Viz Catalogue 全部 59 種資料圖表的互動圖表庫，從長條圖到 Sankey、面量圖。Rust crate 與 Go module 對同一張圖輸出逐位元相同的結果，可輸出 HTML／SVG／PNG，或畫進 egui、Slint、Gio、Fyne；座標軸可用滾輪、拖曳、框選縮放，瀏覽器端透過 WebAssembly。
    tags: ["函式庫", "Rust", "Go", "Charts"]
