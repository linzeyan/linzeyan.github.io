name: Deploy to Github Pages

# run when a commit is pushed to "source" branch
on:
  push:
    branches:
      - main

# The job only reads the repo; gh-pages is pushed with secrets.TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # A run takes about a minute; this only stops a hung download.
    timeout-minutes: 15
    steps:
      # checkout to the commit that has been pushed
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Hugo and Dart Sass at the versions in mise.toml, the ones `make run`
      # builds with. toha needs `sass` on PATH for its Bootstrap stylesheet.
      - name: Setup Hugo and Dart Sass
        uses: jdx/mise-action@v5

      - name: Update Hugo Modules
        run: hugo mod tidy

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install node modules
        run: |
          hugo mod npm pack
          npm install

      - name: Build
        run: hugo --minify

      # push the generated content into the `gh-pages` branch.
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
